name: Inventory regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out current head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install ONNX for synthetic protobuf regression fixtures
        run: python -m pip install onnx==1.23.1
      - name: Compile Python
        run: python -m compileall -q tools tests
      - name: Run inventory regression tests
        # Avoid Windows 8.3 temp aliases breaking path-based filesystem mocks.
        env:
          INVENTORY_REQUIRE_ONNX: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -m unittest discover -s tests -p "test_inventory.py" -v

